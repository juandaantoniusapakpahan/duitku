name: Deploy backend to Elastic Beanstalk

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "Procfile"
      - ".ebextensions/**"
      - ".github/workflows/backend-deploy.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Build jar
        run: mvn -B -f backend/pom.xml package -DskipTests

      - name: Assemble EB deployment package
        run: zip -r deploy.zip Procfile .ebextensions backend/target/*.jar

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: duitku-backend
          environment_name: duitku-backend-env
          region: ap-southeast-1
          version_label: ${{ github.sha }}
          deployment_package: deploy.zip
